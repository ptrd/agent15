java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

base {
    archivesName = 'agent15'
}

dependencies {
    // https://mvnrepository.com/artifact/at.favre.lib/hkdf
    implementation group: 'at.favre.lib', name: 'hkdf', version: '2.0.0'

    testImplementation("org.bouncycastle:bcprov-jdk18on:1.78.1")
}

sourceSets {
    main {
        resources {
            srcDir layout.buildDirectory.dir("generated")
            exclude 'sources/**'
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'tech.kwik.agent15.Version'
    }
}

// version.properties is generated by the root project's generateVersionResource task, into this project's build
// directory, where it is picked up as a resource (see sourceSets above); hence everything consuming that directory
// (processResources, but also the sources jar) must run after it.
processResources.dependsOn rootProject.tasks.generateVersionResource
tasks.withType(Jar).configureEach {
    dependsOn rootProject.tasks.generateVersionResource
}
compileJava.dependsOn processResources

tasks.compileJava {
    options.javaModuleMainClass = "tech.kwik.agent15.Version"
}

mavenPublishing {
    coordinates(null, 'agent15', null)

    pom {
        name = 'Agent15'
        description = 'A (partial) TLS 1.3 implementation in Java, suitable and intended for use in a QUIC implementation.'
    }
}
