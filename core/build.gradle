java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

base {
    archivesName = 'agent15'
}

dependencies {
    // https://mvnrepository.com/artifact/at.favre.lib/hkdf
    implementation group: 'at.favre.lib', name: 'hkdf', version: '2.0.0'

    testImplementation("org.bouncycastle:bcprov-jdk18on:1.78.1")
}

sourceSets {
    main {
        resources {
            srcDir layout.buildDirectory.dir("generated")
            exclude 'sources/**'
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'tech.kwik.agent15.Version'
    }
}

// version.properties is generated by the root project's determineVersion task, into this project's build directory.
processResources.dependsOn rootProject.tasks.determineVersion
compileJava.dependsOn processResources

tasks.compileJava {
    options.javaModuleMainClass = "tech.kwik.agent15.Version"
}

publishing {
    publications {
        library(MavenPublication) {
            artifactId = 'agent15'
            from components.java
            pom {
                name = 'Agent15'
                description = 'A (partial) TLS 1.3 implementation in Java, suitable and intended for use in a QUIC implementation.'
                url = 'https://github.com/ptrd/agent15'

                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0-standalone.html'
                    }
                }

                developers {
                    developer {
                        id = 'peterd'
                        name = 'Peter Doornbosch'
                        email = 'peter.doornbosch@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:git@github.com:ptrd/agent15.git'
                    developerConnection = 'scm:git:git@github.com:ptrd/agent15.git'
                    url = 'https://github.com/ptrd/agent15'
                }
            }
        }
    }
    repositories {
        maven {
            name = "ossrh-staging-api"
            url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            credentials {
                username = project.properties.ossrhUsername
                password = project.properties.ossrhPassword
            }
        }
    }
}

signing {
    sign publishing.publications.library
}
