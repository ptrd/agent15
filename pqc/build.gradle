// The ML-KEM based (hybrid) key exchange groups of RFC 10024. These need java.security.KEM and the
// ML-KEM key pair generator, which are only finalized in Java 25 -- hence this module targets 25,
// where core Agent15 targets 11.
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = 'agent15-pqc'
}

dependencies {
    api project(':core')

    // 1.78.1 predates ML-KEM support (only pre-standardisation Kyber round 3,
    // which is not wire-compatible with FIPS 203 ML-KEM); 1.79+ has real
    // ML-KEM, used to cross-check MLKEMKeyExchange's wire format against an
    // independent implementation.
    testImplementation("org.bouncycastle:bcprov-jdk18on:1.81")
}

mavenPublishing {
    coordinates(null, 'agent15-pqc', null)

    pom {
        name = 'Agent15-PQC'
        description = 'Post-quantum (ML-KEM) hybrid key exchange groups for Agent15.'
    }
}
